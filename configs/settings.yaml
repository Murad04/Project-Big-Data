app:
  name: flight-delay-prediction-platform
  environment: development
  api_host: 0.0.0.0
  api_port: 8000

streaming:
  kafka_bootstrap_servers:
    - localhost:9092
  input_topics:
    - flight-events
    - weather-events
    - airport-events

storage:
  cassandra_keyspace: flight_delay
  raw_table: raw_events
  feature_table: feature_store
  prediction_table: predictions

ml:
  target_column: delay_minutes
  feature_columns:
    - weather_severity
    - airport_congestion
    - time_of_day
    - day_of_week
    - month
    - airline_code
